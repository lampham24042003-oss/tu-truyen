<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tủ Truyện">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Tủ Truyện</title>
<script>try{var t=JSON.parse(localStorage.getItem('tt-apptheme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single portrait column. Covers carry the identity; ink-indigo for story actions, amber for everything "prompt". */
:root{
  --bg:#F3F3F6; --surface:#FFFFFF; --surface-2:#ECECF1; --ink:#111318; --ink-2:#3A3D46; --muted:#7A7E89; --line:rgba(17,19,24,.09);
  --accent:#3442C8; --accent-ink:#FFFFFF; --accent-soft:#E7E9FB;
  --amber:#9C5900; --amber-soft:#FCF0DC; --amber-line:#ECCB93;
  --danger:#C8322B; --danger-soft:#FCE6E4;
  --bar:rgba(243,243,246,.84);
  --shadow:0 1px 2px rgba(17,19,24,.05),0 6px 18px rgba(17,19,24,.06);
  --cover-shadow:0 2px 4px rgba(17,19,24,.12),0 12px 28px rgba(17,19,24,.18);
  --f-ui:"Be Vietnam Pro",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-disp:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-read:"Literata","Iowan Old Style",Georgia,serif;
  --f-mono:"JetBrains Mono",Menlo,monospace;
  --col:560px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C10; --surface:#16171D; --surface-2:#20212A; --ink:#ECEDF1; --ink-2:#C4C6CE; --muted:#8B8E99; --line:rgba(255,255,255,.08);
  --accent:#9AA3FF; --accent-ink:#0B0C10; --accent-soft:#23264A;
  --amber:#F2B44B; --amber-soft:#2D2313; --amber-line:#5A4420;
  --danger:#FF7B70; --danger-soft:#3A1C1A; --bar:rgba(11,12,16,.82);
  --shadow:0 1px 2px rgba(0,0,0,.4); --cover-shadow:0 2px 4px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C10; --surface:#16171D; --surface-2:#20212A; --ink:#ECEDF1; --ink-2:#C4C6CE; --muted:#8B8E99; --line:rgba(255,255,255,.08);
  --accent:#9AA3FF; --accent-ink:#0B0C10; --accent-soft:#23264A;
  --amber:#F2B44B; --amber-soft:#2D2313; --amber-line:#5A4420;
  --danger:#FF7B70; --danger-soft:#3A1C1A; --bar:rgba(11,12,16,.82);
  --shadow:0 1px 2px rgba(0,0,0,.4); --cover-shadow:0 2px 4px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;background:var(--top-band,var(--bar));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;flex:none;display:block}
img{max-width:100%;display:block}

.shell{max-width:var(--col);margin:0 auto;min-height:100vh;position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* bars */
.bar{position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s,transform .25s ease}
.bar.edge{border-color:var(--line)}
.bar-in{display:flex;align-items:center;gap:4px;min-height:52px;padding-block:4px}
.bar .mid{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.bar .mid.show{opacity:1}
.ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ib:active{background:var(--surface-2)}
.tb{height:36px;padding:0 10px;border-radius:18px;display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--accent);font-size:15px;flex:none}
.tb:active{background:var(--accent-soft)}
.tb.back{padding-left:2px;gap:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.amb{background:var(--amber-soft);color:var(--amber);box-shadow:none}
.btn.dan{background:var(--danger-soft);color:var(--danger);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--accent)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.wide{width:100%}
.btn:active{opacity:.85;transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:fixed;z-index:25;right:max(18px,calc((100vw - var(--col))/2 + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:54px;padding:0 22px 0 18px;border-radius:27px;background:var(--ink);color:var(--bg);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.fab:active{transform:scale(.96)}

/* covers */
.cv{position:relative;width:100%;padding-top:150%;border-radius:4px 8px 8px 4px;overflow:hidden;box-shadow:var(--cover-shadow);background:#222}
.cv-in{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:12% 10% 10%}
.cv img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;max-width:none}
.cv::after{content:"";position:absolute;top:0;bottom:0;left:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.10) 45%,rgba(0,0,0,0));pointer-events:none}
.cv .frame{position:absolute;top:5%;left:9%;right:6%;bottom:5%;border:1px solid currentColor;opacity:.28;pointer-events:none}
.cv .g{font-size:.5em;letter-spacing:.22em;text-transform:uppercase;font-weight:600;font-family:var(--f-ui);opacity:.8;position:relative;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .t{font-family:var(--f-disp);font-weight:700;font-size:1.25em;line-height:1.05;position:relative;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;word-break:break-word}
.cv .o{font-size:.6em;opacity:.7;letter-spacing:.4em;position:relative}
.cv .i{font-family:var(--f-disp);font-weight:700;font-size:1.6em;position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%)}
.cv.img-title .cv-in{background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.65));justify-content:flex-end;color:#fff}
.cv.img-title .t{text-shadow:0 1px 8px rgba(0,0,0,.5)}

/* library */
.lib-top{padding-block:14px 4px}
.lib-row{display:flex;align-items:flex-end;gap:6px}
.lib-row h1{flex:1;margin:0;font-family:var(--f-disp);font-size:38px;line-height:1;font-weight:700;letter-spacing:-.01em}
.lib-sub{color:var(--muted);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;height:42px;border-radius:12px;background:var(--surface-2);padding:0 12px;color:var(--muted);margin-top:12px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink)}
.banner{margin-top:12px;display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 10px 10px 14px;background:var(--accent-soft);color:var(--ink-2);font-size:13px;line-height:1.4}
.banner b{color:var(--ink)}
.banner span{flex:1}
.cont{margin-top:16px;display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);width:100%}
.cont .th{width:54px;flex:none;font-size:7px}
.cont-b{flex:1;min-width:0}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.cont-t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cont-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;border-radius:2px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.cont .go{width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-top:24px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sel{position:relative;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:13.5px}
.sel svg{width:16px;height:16px}
.sel select{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:22px 16px;padding-bottom:110px}
@media (min-width:480px){.grid{grid-template-columns:1fr 1fr 1fr}}
.book{display:block;width:100%;font-size:16.5px;min-width:0;align-self:start;text-align:left}
.book:active .cv{transform:scale(.97)}
.book .cv{transition:transform .15s}
.book-t{margin-top:10px;font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book-m{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:56px 8px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted)}
.empty h2{font-family:var(--f-disp);font-size:30px;line-height:1.1;color:var(--ink);margin:0}
.empty p{margin:0;max-width:30ch}
.stack{display:flex;margin-bottom:8px}
.stack>div{width:74px;font-size:8px}
.stack>div:nth-child(1){-webkit-transform:rotate(-8deg) translate(14px,6px);transform:rotate(-8deg) translate(14px,6px)}
.stack>div:nth-child(2){position:relative;z-index:2}
.stack>div:nth-child(3){-webkit-transform:rotate(8deg) translate(-14px,6px);transform:rotate(8deg) translate(-14px,6px)}

/* story */
.hero{position:relative;overflow:hidden;margin-top:-52px;padding-top:62px}
.hero-bg{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-filter:blur(36px) saturate(1.3);filter:blur(36px) saturate(1.3);opacity:.55;-webkit-transform:scale(1.4);transform:scale(1.4)}
.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-fade{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0,var(--bg) 92%)}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:10px 4px}
.hero .cvw{width:138px;font-size:12px}
.hero h1{font-family:var(--f-disp);font-size:31px;line-height:1.08;font-weight:700;margin:18px 0 0;max-width:20ch}
.hero .gen{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .meta{margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.acts{display:flex;flex-direction:column;gap:10px;padding-block:18px 6px}
.acts .btn.pri{height:50px;font-size:16px}
.qa{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:8px}
.qa button{background:var(--surface);border-radius:14px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.qa button svg{color:var(--accent)}
.qa button:active{background:var(--surface-2)}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button.on.a{color:var(--amber)}
.seg .n{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.tabwrap{position:-webkit-sticky;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);padding-block:12px 10px}
.list-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding:2px 2px 8px}
.list-h .tb svg{width:15px;height:15px}
.group{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;position:relative}
.ch+.ch::before{content:"";position:absolute;top:0;right:0;left:64px;height:1px;background:var(--line)}
.ch:active{background:var(--surface-2)}
.num{min-width:38px;height:38px;padding:0 4px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;flex:none;color:var(--ink-2)}
.ch.cur .num{background:var(--accent);color:var(--accent-ink)}
.ch.read .num{color:var(--muted)}
.ch-b{flex:1;min-width:0}
.ch-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.read .ch-t{color:var(--muted);font-weight:500}
.ch-m{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:1px;font-variant-numeric:tabular-nums}
.pdot{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:5px}
.chk{width:24px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--muted);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.chk svg{width:15px;height:15px}
.ch.on .chk{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.selbar{position:fixed;z-index:26;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.selbar-in{max-width:var(--col);margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:10px}
.selbar .cnt{flex:1;font-size:13.5px;color:var(--muted);min-width:0;text-align:center}
.selbar .cnt b{color:var(--ink);font-size:15px}
.range{display:flex;gap:8px;margin-bottom:10px}
.range input{flex:1;min-width:0}
.bottom-space{height:120px}

/* prompts */
.pr{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.pr-h{display:flex;align-items:center;gap:8px;padding:12px 8px 10px 14px}
.pr-h .lbl{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-h .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:1px}
.pr-body{font-family:var(--f-mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;padding:0 14px 14px;color:var(--ink-2)}
.pr.clamp .pr-body{max-height:10em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent)}
.pr-more{display:block;width:100%;padding:10px;font-size:13px;font-weight:600;color:var(--amber);border-top:1px solid var(--line);text-align:center}
.pr-none{padding:0 14px 14px;color:var(--muted);font-size:13px;font-style:italic}

/* editor */
.ed{display:flex;flex-direction:column;min-height:calc(100vh - 52px - env(safe-area-inset-top,0px));padding-block:10px 12px}
.ed-meta{display:grid;grid-template-columns:84px 1fr;grid-gap:8px;margin-bottom:12px}
.in{width:100%;border:0;background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;outline:none;box-shadow:inset 0 0 0 1px var(--line);-webkit-appearance:none;appearance:none}
.in:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.lab{font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 5px 2px;display:block}
.ed-tools{display:flex;align-items:center;gap:6px;margin:10px 0 8px}
.ed-tools .cnt{flex:1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ed-tools .btn svg{width:17px;height:17px}
.ed-pane{flex:1;display:flex;flex-direction:column}
textarea.big{flex:1;width:100%;min-height:52vh;resize:none;border:0;border-radius:16px;padding:16px;font-size:16px;line-height:1.65;outline:none;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);-webkit-appearance:none}
textarea.big.story{font-family:var(--f-read)}
textarea.big.prompt{font-family:var(--f-mono);font-size:14.5px;background:var(--amber-soft);box-shadow:inset 0 0 0 1px var(--amber-line)}
textarea.big:focus{box-shadow:inset 0 0 0 2px var(--accent)}
textarea.big.prompt:focus{box-shadow:inset 0 0 0 2px var(--amber)}
.ed-foot{display:flex;gap:8px;padding-top:12px}
.ed-foot .btn{flex:1;padding:0 10px}
.note{font-size:12.5px;background:var(--accent-soft);color:var(--ink-2);border-radius:12px;padding:8px 8px 8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}

/* reader */
.reader{--rs:19px;--lh:1.8;background:var(--rbg);color:var(--rfg);min-height:100vh;touch-action:pan-y;--rbg:var(--bg);--rfg:var(--ink);--rmut:var(--muted);--rline:var(--line);--rbar:var(--bar)}
.reader.t-paper{--rbg:#FAF6EE;--rfg:#2B2620;--rmut:#8A7F6F;--rline:rgba(60,45,20,.12);--rbar:rgba(250,246,238,.88)}
.reader.t-sepia{--rbg:#EEE1C4;--rfg:#43351F;--rmut:#86734F;--rline:rgba(70,50,20,.15);--rbar:rgba(238,225,196,.9)}
.reader.t-white{--rbg:#FFFFFF;--rfg:#1C1C1C;--rmut:#7A7A7A;--rline:rgba(0,0,0,.08);--rbar:rgba(255,255,255,.88)}
.reader.t-night{--rbg:#121316;--rfg:#C9C6BF;--rmut:#7D7A74;--rline:rgba(255,255,255,.07);--rbar:rgba(18,19,22,.88)}
.reader .bar{background:var(--rbar);color:var(--rfg)}
.reader .bar.edge{border-color:var(--rline)}
.reader .ib{color:var(--rfg)}
.reader .bar.hide{-webkit-transform:translateY(-130%);transform:translateY(-130%)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
.rhead-wrap{font-size:var(--rs)}
.r-head{padding-block:34px 6px;text-align:center}
.r-head .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rmut);font-weight:600}
.r-head h2{font-family:var(--f-read);font-weight:700;font-size:1.45em;line-height:1.25;margin:12px 0 0}
.r-head .orn{color:var(--rmut);margin-top:14px;font-size:13px}
.r-sw{display:flex;justify-content:center;margin-top:16px}
.r-sw .seg{background:transparent;box-shadow:inset 0 0 0 1px var(--rline);width:200px}
.r-sw .seg button{height:30px;font-size:12.5px;color:var(--rmut)}
.r-sw .seg button.on{background:var(--rfg);color:var(--rbg)}
.r-sw .seg button.on.a{background:var(--amber);color:#1A1205}
.prose{font-size:var(--rs);line-height:var(--lh);padding-block:20px 22px;word-wrap:break-word;overflow-wrap:break-word}
.prose.serif{font-family:var(--f-read)}
.prose.sans{font-family:var(--f-ui)}
.prose.just p{text-align:justify}
.prose p{margin:0 0 .85em}
.prose.indent p{text-indent:1.5em;margin:0 0 .3em}
.prose h3{font-size:1.1em;margin:1.4em 0 .6em;text-align:center}
.prose .scene{text-align:center;color:var(--rmut);margin:1.3em 0;letter-spacing:.5em}
.prose.serif>p:first-of-type:first-letter{font-size:3em;float:left;line-height:.85;margin:.05em .08em 0 0;font-weight:700;color:var(--accent)}
.pbox{font-family:var(--f-mono);font-size:calc(var(--rs) * .78);line-height:1.7;white-space:pre-wrap;word-wrap:break-word;border-radius:16px;padding:16px;margin-top:20px;background:var(--amber-soft);color:var(--rfg);box-shadow:inset 0 0 0 1px var(--amber-line)}
.reader.t-night .pbox,.reader.t-sepia .pbox,.reader.t-paper .pbox,.reader.t-white .pbox{background:rgba(214,150,40,.1);box-shadow:inset 0 0 0 1px rgba(214,150,40,.35)}
.r-end{text-align:center;color:var(--rmut);font-size:13px;padding-block:6px 18px}
.r-nav{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;padding-block:6px 40px}
.r-nav button{box-shadow:inset 0 0 0 1px var(--rline);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--rfg);text-align:left}
.r-nav button.nx{text-align:right;align-items:flex-end}
.r-nav small{font-size:11px;color:var(--rmut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.r-nav span{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.r-nav button[disabled]{opacity:.35}
.zpill{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));-webkit-transform:translateX(-50%);transform:translateX(-50%);background:rgba(17,19,24,.88);color:#fff;font-weight:600;font-size:14px;padding:8px 16px;border-radius:20px;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums}
.zpill.on{opacity:1}

/* sheets */
.scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,9,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;-webkit-animation:fade .2s ease;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:var(--col);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;padding-block:6px calc(18px + env(safe-area-inset-bottom,0px));-webkit-animation:up .28s cubic-bezier(.2,.8,.2,1);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grip{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sh-h h3{flex:1;margin:0;font-family:var(--f-disp);font-size:26px;line-height:1.1}
.sh-sub{color:var(--muted);font-size:13.5px;margin:-8px 0 14px}
.sh-sec{margin-bottom:16px}

.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;font-size:15px;position:relative;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}

.row .ico svg{width:18px;height:18px}
.row .ico.a{background:var(--amber-soft);color:var(--amber)}
.row .ico.d{background:var(--danger-soft);color:var(--danger)}
.row .tx{flex:1;min-width:0}
.row .tx small{display:block;color:var(--muted);font-size:12.5px}
.row.d{color:var(--danger)}
.row:active{background:var(--surface-2)}
.tog{width:46px;height:28px;border-radius:14px;background:var(--surface-2);position:relative;flex:none;transition:background .2s;box-shadow:inset 0 0 0 1px var(--line)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:-webkit-transform .2s;transition:transform .2s}
.tog.on{background:var(--accent)}
.tog.on::after{-webkit-transform:translateX(18px);transform:translateX(18px)}
.cover-edit{display:flex;gap:16px;align-items:flex-start}
.cover-edit .cvw{width:96px;font-size:8.5px;flex:none}
.cover-edit .ce-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pal{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:8px}
.pal button{height:34px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pal button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.more-t{color:var(--accent);font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;margin:0 0 16px}
.sz{display:flex;align-items:center;gap:10px}
.sz input{flex:1}
.sz .v{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.themes{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:8px}
.themes button{height:54px;border-radius:12px;font-family:var(--f-read);font-weight:600;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.themes button small{font-family:var(--f-ui);font-size:10px;font-weight:600;margin-top:4px;opacity:.75}
.themes button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.toc{max-height:62vh;overflow:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));-webkit-transform:translate(-50%,16px);transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:.22s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
.skel{border-radius:8px;background:var(--surface-2);padding-top:150%}
@-webkit-keyframes fade{from{opacity:0}}@keyframes fade{from{opacity:0}}
@-webkit-keyframes up{from{-webkit-transform:translateY(60px);opacity:.3}}@keyframes up{from{transform:translateY(60px);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{-webkit-animation:none!important;animation:none!important;transition:none!important}}
</style>

/* ---------- scroll, progress, pinch-to-resize text ---------- */
var lastY = 0, posT, pinch = null, zT, raf = 0;
function onScroll() {
  var bar = $('#bar'), y = window.scrollY;
  if (!bar) return;
  if (S.view !== 'reader') {
    bar.classList.toggle('edge', y > 8 || S.view === 'editor');
    var m = bar.querySelector('.mid');
    if (m && S.view === 'story') m.classList.toggle('show', y > 220);
    if (m && S.view === 'library') m.classList.toggle('show', y > 40);
    return;
  }
  var max = document.documentElement.scrollHeight - innerHeight;
  var r = max > 0 ? Math.min(1, y / max) : 1;
  var p = $('#prog'); if (p) p.style.width = (r * 100) + '%';
  if (!pinch) {
    bar.classList.toggle('edge', y > 8);
    if (y > lastY + 6 && y > 140) bar.classList.add('hide'); else if (y < lastY - 6 || y < 60) bar.classList.remove('hide');
  }
  lastY = y;
  if (S.rtab === 'story' && S.chapterId) {
    clearTimeout(posT);
    var cid = S.chapterId;
    posT = setTimeout(function () { posMap[cid] = r; ls.set('tt-pos', posMap); if (r > 0.9 && !readSet[cid]) { readSet[cid] = 1; ls.set('tt-read', Object.keys(readSet)); } }, 300);

function setSize(n, anchor) {

  var ratio = anchor != null ? anchor : (max0 > 0 ? window.scrollY / max0 : 0);

  var r = $('#reader'); if (r) r.style.setProperty('--rs', n + 'px');
  window.scrollTo(0, ratio * (document.documentElement.scrollHeight - innerHeight));
  var zp = $('#zpill'); zp.textContent = 'Cỡ chữ ' + n; zp.classList.add('on');
  clearTimeout(zT); zT = setTimeout(function () { zp.classList.remove('on'); savePrefs(); }, 700);
  var sl = $('#o-size'); if (sl) { sl.value = n; $('#o-size-v').textContent = n; }
}
function dist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
document.addEventListener('touchstart', function (e) {
  if (S.view !== 'reader' || e.touches.length !== 2 || $('.scrim')) return;
  var max = document.documentElement.scrollHeight - innerHeight;

}, { passive: false });

  if (S.view !== 'reader' || $('.scrim')) return;
  var mod = e.metaKey || e.ctrlKey;
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); setSize(prefs.size + 1); }
  else if (mod && e.key === '-') { e.preventDefault(); setSize(prefs.size - 1); }

  else if (!mod && e.key === 'ArrowLeft') { var b2 = $('.r-nav button:not(.nx):not([disabled])'); if (b2) b2.click(); }

/* copy sheet: choose chapters + what to include */
function parseRange(str, chs) {
  var nums = {}, any = false;
  String(str || '').split(/[,;\s]+/).forEach(function (part) {
    var m = part.match(/^(\d+)[-–—](\d+)$/), n = /^\d+$/.test(part);
    if (m) { var a = +m[1], b = +m[2]; if (a > b) { var t = a; a = b; b = t; } for (var i = a; i <= b && i - a < 10000; i++) nums[i] = 1; any = true; }
    else if (n) { nums[+part] = 1; any = true; }
  });
  if (!any) return null;
  return chs.filter(function (c) { return nums[+c.num]; });
}
function compact(chs) {
  var ns = chs.map(function (c) { return +c.num; }).filter(function (n) { return !isNaN(n); }).sort(function (a, b) { return a - b; });
  var out = [], i = 0;
  while (i < ns.length) { var a = ns[i], b = a; while (i + 1 < ns.length && ns[i + 1] <= b + 1) { i++; b = ns[i]; } out.push(a === b ? String(a) : a + '-' + b); i++; }
  return out.join(', ');
}

    '<div class="chips"><button class="btn sm" data-r="all">Tất cả</button><button class="btn sm" data-r="cur">Chương đang đọc</button><button class="btn sm" data-r="last5">5 chương cuối</button><button class="btn sm" data-r="pick">Chọn trong danh sách</button></div></div>' +

          if (S.edCount) S.edCount(); if (S.edDraft) S.edDraft(); toast('Đã dán ' + fmtN(words(txt)) + ' chữ');
        }, function () { ta.focus(); toast('Chạm giữ trong ô rồi chọn Dán'); });
      } else { ta.focus(); toast('Chạm giữ trong ô rồi chọn Dán'); }
      break;
    }
    case 'ed-clear': {
      var tb2 = S.edTab === 'prompt' ? $('#ed-prompt') : $('#ed-content');
      if (!tb2.value) break;
      confirmSheet('Xoá trắng ô này?', 'Nội dung đang gõ trong ô ' + (S.edTab === 'prompt' ? 'Prompt' : 'Nội dung') + ' sẽ bị xoá.', 'Xoá trắng', function () { tb2.value = ''; if (S.edCount) S.edCount(); if (S.edDraft) S.edDraft(); });
      break;
    }
    case 'back-story': go('story'); break;
    case 'rtab': S.rtab = b.getAttribute('data-k'); renderReader(); break;
    case 'goch': if (id) { S.chapterId = id; renderReader(); } break;
    case 'aa': readerOptions(); break;
    case 'toc': tocSheet(); break;
    case 'copy-ch-prompt': copyText((findCh(S.chapterId) || {}).prompt || '', 'Đã copy prompt'); break;
    case 'ch-menu': {
      var c = findCh(S.chapterId);
      sheet('<div class="sh-h"><h3>Chương ' + esc(c.num) + '</h3><button class="ib" data-x="close" aria-label="Đóng">' + I.x + '</button></div><div class="card sh-sec">' +
        '<button class="row" data-x="cc"><span class="ico">' + I.copy + '</span><span class="tx">Copy nội dung chương này<small>' + fmtN(c.words) + ' chữ</small></span></button>' +
        '<button class="row" data-x="cp"><span class="ico a">' + I.spark + '</span><span class="tx">Copy prompt chương này</span></button>' +
        '<button class="row" data-x="cm"><span class="ico">' + I.list + '</span><span class="tx">Copy nhiều chương…</span></button></div>' +
        '<div class="card"><button class="row" data-x="ed"><span class="ico">' + I.edit + '</span><span class="tx">Sửa chương</span></button>' +
        '<button class="row d" data-x="del"><span class="ico d">' + I.trash + '</span><span class="tx">Xoá chương</span></button></div>', function (sc) {
          q(sc, '[data-x=close]').onclick = closeSheet;
          q(sc, '[data-x=cc]').onclick = function () { copyText(c.content || '', 'Đã copy chương ' + c.num); closeSheet(); };
          q(sc, '[data-x=cp]').onclick = function () { copyText(c.prompt || '', c.prompt ? 'Đã copy prompt' : 'Chương này chưa có prompt'); closeSheet(); };
          q(sc, '[data-x=cm]').onclick = function () { copySheet(null); };
          q(sc, '[data-x=ed]').onclick = function () { openEditor(c.id); };
          q(sc, '[data-x=del]').onclick = function () { confirmSheet('Xoá chương ' + esc(c.num) + '?', 'Prompt và nội dung của chương này sẽ bị xoá khỏi máy.', 'Xoá chương', function () { return deleteChapter(c.id); }); };
        });
      break;
    }
  }
});

/* ---------- flex-gap fallback for old Safari (iOS < 14.1) ---------- */
(function () {
  var t = document.createElement('div');
  t.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
  t.appendChild(document.createElement('div')); t.appendChild(document.createElement('div'));
  document.body.appendChild(t); var ok = t.scrollHeight === 1; document.body.removeChild(t);
  if (ok) return;
  var pending = false;
  function fix() {
    pending = false;
    Array.prototype.forEach.call(document.querySelectorAll('body *'), function (el) {
      var tag = el.tagName; if (tag === 'P' || tag === 'svg' || tag === 'path' || tag === 'circle' || tag === 'rect' || tag === 'TEXTAREA' || tag === 'INPUT') return;
      if (el.closest && el.closest('.prose,.pbox')) return;
      var cs = getComputedStyle(el); if (cs.display.indexOf('flex') < 0) return;
      var cg = parseFloat(cs.columnGap) || 0, rg = parseFloat(cs.rowGap) || 0;
      if (!cg && !rg) return;
      var col = cs.flexDirection.indexOf('column') === 0, first = true;
      Array.prototype.forEach.call(el.children, function (k) {
        var ks = getComputedStyle(k);
        if (ks.display === 'none' || ks.position === 'absolute' || ks.position === 'fixed') return;
        if (first) { first = false; return; }
        if (col) k.style.marginTop = rg + 'px'; else k.style.marginLeft = cg + 'px';
      });
    });
  }
  new MutationObserver(function () { if (!pending) { pending = true; requestAnimationFrame(fix); } }).observe(document.body, { childList: true, subtree: true });
  fix();
})();

/* ---------- offline ---------- */
var APP_VERSION = 4;
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  // a new version took over: reload once so the newest app shows (skip while typing in the editor)
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloaded || S.view === 'editor') return;
    reloaded = true; location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      // check for updates whenever the app comes back to the foreground
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
    }).catch(function () {});
  });
}

/* ---------- boot ---------- */
renderLibrary();
Store.init().then(function () { return Store.all('covers'); }).then(function (cs) {
  cs.forEach(function (c) { covers[c.id] = c.data; });
}, function () {}).then(function () {
  Store.watch(function () { return Store.all('stories'); }, function (list) {
    S.stories = list; S.ready = true;
    if (S.view === 'library') renderLibrary();
  });
});
})();
</script>
